spring.rabbitmq.username=admin
spring.rabbitmq.password=123
rabbitmq.queue.name=notification-queue
rabbitmq.exchange.name=transfer-exchange
rabbitmq.routing.key.notification=notification.routing.key

ms-user.url=http://localhost:8081
authorization.service.url=https://testbanco.free.beeceptor.com/auth

server.port=8083
